# Demo configuration. The code repo, docs folder and database are added as *connectors* by
# `askcite demo setup` (see the Connectors page), so this file only holds general settings.
timezone: Asia/Kolkata

ai:
  # Free and local by default: install Ollama and run `ollama pull qwen2.5:7b`.
  # Any LiteLLM model works, e.g. anthropic/claude-sonnet-5 or openai/gpt-5 (set the API key in .env).
  cloud_model: ollama_chat/qwen2.5:7b
  policy:
    docs: cloud
    code: cloud
    schema: cloud
    data_values: local   # the demo model runs on your machine and the data is fake anyway

limits:
  max_tool_calls: 10
  max_queries: 2
  max_seconds: 240       # local models are slower
