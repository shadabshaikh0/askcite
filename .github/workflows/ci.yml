name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: askcite
          POSTGRES_USER: askcite
          POSTGRES_PASSWORD: askcite
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U askcite" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ASKCITE_TEST_STORE_URL: postgresql://askcite:askcite@localhost:5433/askcite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test (unit + Postgres integration)
        run: pytest -q
