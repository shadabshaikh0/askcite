# Public live demo of Askcite with the FAKE demo shop. On a server:
#   cp .env.example .env   # fill in GEMINI_API_KEY and DEMO_HOST
#   docker compose up -d --build
# Then open https://$DEMO_HOST. Only Caddy is reachable from outside (ports 80/443).
name: askcite-demo

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: askcite
      POSTGRES_USER: askcite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askcite-demo}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askcite"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: ../..
    command:
      - sh
      - -c
      - >-
        askcite demo setup --example /app/examples/demo-shop --in-place --skip-if-ready &&
        askcite run --host 0.0.0.0 --public-demo --trust-proxy
    environment:
      ASKCITE_STORE_URL: postgresql://askcite:${POSTGRES_PASSWORD:-askcite-demo}@postgres:5432/askcite
      ASKCITE_CONFIG_DIR: /app/examples/demo-shop/config
      ASKCITE_DATA_DIR: /data
      ASKCITE_MODEL: ${ASKCITE_MODEL:-gemini/gemini-flash-latest}
      ASKCITE_FALLBACK_MODELS: ${ASKCITE_FALLBACK_MODELS:-gemini/gemini-flash-lite-latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      ASKCITE_ADMIN_PASSWORD: ${ASKCITE_ADMIN_PASSWORD:?set ASKCITE_ADMIN_PASSWORD in .env}
    volumes: [appdata:/data]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DEMO_HOST: ${DEMO_HOST:?set DEMO_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [app]
    restart: unless-stopped

volumes:
  pgdata: {}
  appdata: {}
  caddydata: {}
